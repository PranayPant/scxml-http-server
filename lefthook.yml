# Lefthook configuration — pre-commit quality pipeline + pre-push coverage.
# Docs: https://github.com/evilmartians/lefthook
#
# Run `lefthook install` after editing this file to (re)write the git hooks.
#
# Pre-commit runs fast checks (format, credo, stale tests). Coverage is
# deferred to pre-push where the full suite runs under `mix coveralls`.

pre-commit:
  parallel: true
  commands:
    styler-and-format:
      glob: "*.{ex,exs}"
      run: mix format --check-formatted
    credo-linter:
      glob: "*.{ex,exs}"
      run: mix credo --strict
    test-suite:
      glob: "*.{ex,exs}"
      run: mix test --stale

pre-push:
  parallel: true
  commands:
    coveralls:
      run: mix coveralls
