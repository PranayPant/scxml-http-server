# Lefthook configuration — pre-commit quality pipeline.
# Docs: https://github.com/evilmartians/lefthook
#
# Run `lefthook install` after editing this file to (re)write the git hooks.
#
# `coverage` runs the full test suite under --cover AND enforces the 100%
# threshold, so a separate `mix test --stale` stage is redundant — and running
# two `mix test`s in parallel over the same _build dir makes coverage flaky.

pre-commit:
  parallel: true
  commands:
    styler-and-format:
      glob: "*.{ex,exs}"
      run: mix format --check-formatted
    credo-linter:
      glob: "*.{ex,exs}"
      run: mix credo --strict
    coverage:
      glob: "*.{ex,exs}"
      run: mix test --cover
