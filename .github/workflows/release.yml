name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          path: scxml-http-server

      # --- Elixir setup for OpenAPI dump ---
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - name: Install server deps
        run: mix deps.get
        working-directory: scxml-http-server

      - name: Dump OpenAPI spec
        run: mix openapi.spec.json --spec ScxmlHttpEngine.OpenApi.ApiSpec --filename openapi.json --start-app=false
        working-directory: scxml-http-server

      # --- Create GitHub Release (publish OpenAPI spec as release asset) ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: scxml-http-server/openapi.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}